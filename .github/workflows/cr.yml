name: Kết quả Chess-Results
on:
  schedule:
    - cron: '*/5 0-15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cr-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Đọc Chess-Results
        run: node tools/cr-fetch.mjs
      - name: Lưu kết quả (không build lại web)
        run: |
          if [ -n "$(git status --porcelain data/cr)" ]; then
            git config user.name "cr-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/cr
            git commit -m "Cập nhật kết quả Chess-Results [CF-Pages-Skip]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
